name: Core tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Prepare hash-audited official source (no installed datasets)
        run: python scripts/setup_source.py
      - name: Test conversation, tools and runtimes without model credentials
        run: python -m unittest discover -s tests -v
      - name: Test browser formatting, language and graph interactions
        run: |
          node tests/test_markdown.cjs
          node tests/test_i18n.cjs
          node tests/test_stage6_graph.cjs

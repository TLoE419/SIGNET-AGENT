name: Core tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Prepare hash-audited official source (no installed datasets)
        run: python scripts/setup_source.py
      - name: Test conversation, tools and runtimes without model credentials
        run: python -m unittest discover -s tests -v
  electron:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pinned Electron dependencies
        run: npm ci --prefix electron
      - name: Diagnose runner service startup
        run: |
          python - <<'PYTHON'
          import faulthandler, sys, tempfile
          from pathlib import Path
          faulthandler.dump_traceback_later(15, exit=True)
          from chat_ui import create_server
          print('Python interpreter:', sys.executable, flush=True)
          with tempfile.TemporaryDirectory() as directory:
              print('Creating local service', flush=True)
              server = create_server(state_file=Path(directory) / 'state.json', port=0)
              print('Local service ready:', server.server_port, flush=True)
              server.server_close()
          faulthandler.cancel_dump_traceback_later()
          PYTHON
      - name: Test owned backend and navigation boundaries
        run: npm test --prefix electron
      - name: Test native interface and service shutdown
        run: npm run test:smoke --prefix electron
      - name: Test package entry creates a visible chat window
        run: npm run test:startup --prefix electron

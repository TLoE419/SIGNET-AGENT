<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGNET Network Results</title>
<style>
body{font:16px system-ui;margin:12px;background:white;color:#222}h1{font-size:20px}section{padding:8px;margin:8px 0}.controls{display:flex;gap:16px;flex-wrap:wrap}input,select{font:inherit;padding:4px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:8px}svg{width:100%;height:auto;aspect-ratio:9/7;max-height:550px}svg text{font:16px system-ui}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;border-bottom:1px solid #ddd;padding:6px}.scroll{max-height:550px;overflow:auto}@media(max-width:600px){.grid{display:block}}
</style>
<header><h1>Gene Regulatory Network</h1></header>
<main><section class="controls"><label>Bootstrap frequency ≥ <input id="cutoff" type="range" min="0.1" max="1" step="0.1" value="0.8"> <b id="value"></b></label><label>Gene <select id="gene"><option value="">All</option></select></label><span id="summary"></span></section>
<div class="grid"><section><svg id="graph" viewBox="0 0 900 700"></svg><small>Source → target. Blue: coefficient ≥ 0; red: coefficient &lt; 0.</small></section><section class="scroll"><h2>Edges</h2><table><thead><tr><th>Source → target</th><th>Frequency</th><th>Coefficient</th></tr></thead><tbody id="edges"></tbody></table></section></div></main>
<script>
const data=__NETWORK_DATA__;
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
data.genes.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;$('gene').append(o)});
function element(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.append(el);return el}
function update(){
 const cutoff=+$('cutoff').value,gene=$('gene').value;
 const edges=data.edges.filter(e=>e.frequency>=cutoff-1e-15&&(!gene||e.source===gene||e.target===gene)).sort((a,b)=>b.frequency-a.frequency||a.source.localeCompare(b.source));
 const names=[...new Set(edges.flatMap(e=>[e.source,e.target]))].sort();
 $('value').textContent=cutoff.toFixed(1);$('summary').textContent=`${names.length} genes · ${edges.length} edges`;
 const svg=$('graph');svg.replaceChildren();
 const defs=element('defs',{},svg);for(const color of ['#2670b5','#bc4654']){const marker=element('marker',{id:color.slice(1),viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'},defs);element('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:color},marker)}
 const pos=new Map(names.map((g,i)=>{const a=2*Math.PI*i/names.length-Math.PI/2;return[g,[450+285*Math.cos(a),350+285*Math.sin(a)]]}));
 for(const e of edges){const [x1,y1]=pos.get(e.source),[x2,y2]=pos.get(e.target),d=Math.hypot(x2-x1,y2-y1)||1,c=e.coefficient>=0?'#2670b5':'#bc4654';const line=element('line',{x1:x1+8*(x2-x1)/d,y1:y1+8*(y2-y1)/d,x2:x2-9*(x2-x1)/d,y2:y2-9*(y2-y1)/d,stroke:c,'stroke-width':gene?2:1,'stroke-opacity':gene?0.8:0.3,'marker-end':`url(#${c.slice(1)})`},svg);element('title',{},line).textContent=`${e.source} → ${e.target} | ${e.frequency} | ${e.coefficient}`}
 for(const [g,[x,y]] of pos){const node=element('g',{style:'cursor:pointer'},svg);element('circle',{cx:x,cy:y,r:5,fill:'#173b52'},node);element('text',{x:x+(x<450?-9:9),y:y+4,'text-anchor':x<450?'end':'start'},node).textContent=g;node.onclick=()=>{$('gene').value=g;update()}}
 $('edges').replaceChildren();for(const e of edges){const tr=document.createElement('tr');for(const v of [`${e.source} → ${e.target}`,e.frequency.toFixed(2),e.coefficient.toFixed(4)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('edges').append(tr)}
}
$('cutoff').oninput=update;$('gene').onchange=update;update();
</script></html>
